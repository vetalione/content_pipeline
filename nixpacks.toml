[phases.setup]
# Only keep openssl (required by Prisma). Removed duplicate chromium/playwright-driver nix packages
# — playwright installs its own Chromium in the install phase below.
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "npm install --ignore-scripts --legacy-peer-deps",
  # Install only Chromium (skip Firefox/WebKit) — saves ~600 MB in the container
  "npx playwright install chromium --with-deps"
]

[phases.build]
cmds = [
  "npx prisma@5.22.0 generate --schema=packages/api/prisma/schema.prisma",
  "npm run build --workspace=packages/shared",
  "npm run build --workspace=packages/api", 
  "npm run build --workspace=packages/web"
]

[start]
# Apply any pending Prisma migrations against production DB before booting.
# `migrate deploy` is the production-safe command (no schema diffing, no prompts).
cmd = "npx prisma@5.22.0 migrate deploy --schema=packages/api/prisma/schema.prisma && npm run start --workspace=packages/api"
